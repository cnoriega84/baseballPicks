<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pennant Pulse Live JSON</title>
  <style>
    body { margin: 0; padding: 18px; color: #f3ded3; background: #1f2174; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <pre id="json">{"status":"loading","message":"Running Pennant Pulse version-two model..."}</pre>
  <script src="oracle-core.js"></script>
  <script>
    (async () => {
      const output = document.getElementById('json');
      const url = new URL(window.location.href);
      const requestedDate = url.searchParams.get('date');
      const date = /^\d{4}-\d{2}-\d{2}$/.test(requestedDate || '')
        ? requestedDate
        : window.DiamondOracleCore.todayPacific();

      try {
        const payload = await window.DiamondOracleCore.generateBoard(date);
        const feed = window.DiamondOracleCore.buildFeed(payload);
        const json = JSON.stringify(feed, null, 2);
        output.textContent = json;
        document.title = `Pennant Pulse JSON ${date}`;

        const machineReadable = document.createElement('script');
        machineReadable.id = 'pennantPulseData';
        machineReadable.type = 'application/json';
        machineReadable.textContent = json;
        document.body.appendChild(machineReadable);
      } catch (error) {
        output.textContent = JSON.stringify({
          schemaVersion: 2,
          modelVersion: 'pennant-pulse-v2-lineup-recent-bullpen',
          status: 'error',
          date,
          message: error.message
        }, null, 2);
      }
    })();
  </script>
</body>
</html>
